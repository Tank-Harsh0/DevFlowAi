# =============================================================================
# DevFlow AI — Docker Compose
#
# Services:
#   backend   — FastAPI / uvicorn        http://localhost:8000
#   frontend  — Vite dev server          http://localhost:5173
#
# Database: MongoDB Atlas (external cloud service — not containerised).
#   Supply MONGODB_URI in a root .env file or as an environment variable.
#   The backend container reads it at runtime — never hardcode it here.
#
# Usage:
#   docker compose up --build     # first run (builds images)
#   docker compose up -d          # start in background
#   docker compose down           # stop containers
#   docker compose logs -f        # tail all logs
#   docker compose logs -f backend
# =============================================================================

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # CORS — allows the Vite dev server (running in the browser) to call the API.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      # MongoDB Atlas connection string — REQUIRED. Set in your .env file.
      MONGODB_URI: ${MONGODB_URI}
      # Optional: override the database name (default: devflow)
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-devflow}
      # JWT secret — CHANGE THIS in production.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:-devflow-change-me-in-production-use-a-real-secret!!}
      # Access token lifetime in minutes (default: 60 = 1 hour)
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      # Source mount — uvicorn --reload picks up live code changes without rebuild.
      - ./backend:/app
      # Isolate the image's site-packages; never use the host .venv inside Docker.
      - /app/.venv
    networks:
      - devflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: devflow_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Must be a URL the BROWSER can reach — localhost, not the Docker service name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      # Source mount for Vite HMR.
      - ./frontend:/app
      # Isolate the image's node_modules from the host directory.
      - /app/node_modules
    networks:
      - devflow_net
    depends_on:
      backend:
        condition: service_healthy

# =============================================================================
# Networks
# =============================================================================
networks:
  devflow_net:
    name: devflow_network

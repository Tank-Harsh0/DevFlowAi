# =============================================================================
# DevFlow AI — Docker Compose
#
# Services:
#   frontend  — Vite dev server          http://localhost:5173
#   backend   — FastAPI / uvicorn        http://localhost:8000
#
# Database: MongoDB Atlas (external cloud service — NOT containerised).
#   Do NOT add a local mongodb: service here.
#   When Phase 6 database integration is active, supply MONGODB_URI in .env:
#     MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/<db>?...
#   The backend container reads MONGODB_URI from the environment at runtime.
#   Never hardcode the URI here.
#
# Usage:
#   docker compose up --build     # start all services (build first)
#   docker compose up -d          # start in background
#   docker compose down           # stop and remove containers
#   docker compose logs -f        # tail all logs
#   docker compose logs -f backend
# =============================================================================

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # CORS — allows the Vite dev server to call the API from the browser.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      # Pass through any additional env vars when they become required.
      # MongoDB Atlas — NOT containerised. Supply the Atlas URI via .env.
      # Uncomment when Phase 6 MongoDB integration is active:
      # MONGODB_URI: ${MONGODB_URI:-}
      # GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      # Source mount enables uvicorn --reload (hot reload) without rebuilding.
      - ./backend:/app
      # Isolate the image's site-packages from the host .venv.
      - /app/.venv
    networks:
      - devflow_net

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: devflow_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # VITE_API_BASE_URL must be a URL the BROWSER can reach — i.e. localhost,
      # not the Docker service name "backend". The browser runs outside Docker.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      # Source mount for Vite HMR.
      - ./frontend:/app
      # Isolate the image's node_modules from the host directory.
      - /app/node_modules
    networks:
      - devflow_net
    depends_on:
      - backend

# =============================================================================
# Networks
# =============================================================================
networks:
  devflow_net:
    name: devflow_network
